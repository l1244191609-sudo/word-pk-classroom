x}.quiz-card{width:min(980px,100%);border:4px solid white;border-radius:8px;padding:clamp(18px,3vw,32px);color:white;background:rgba(15,23,42,.94);box-shadow:0 24px 68px rgba(15,23,42,.38);text-align:center}.status{min-height:56px;display:grid;place-items:center;border-radius:8px;padding:8px 14px;background:rgba(255,255,255,.12);font-size:clamp(24px,3.1vw,48px);font-weight:1000}.status.red{background:var(--red);animation:pulse .8s ease-in-out infinite alternate}.status.blue{background:var(--blue);animation:pulse .8s ease-in-out infinite alternate}.status.warn{background:#b45309}.status.done{background:var(--green)}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.025)}}.word-meta{min-height:32px;margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.word-meta span{border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);font-size:14px;font-weight:900}.question-word{margin-top:10px;min-height:1.05em;overflow-wrap:anywhere;font-size:clamp(54px,9vw,126px);line-height:1.02;letter-spacing:0;font-weight:1000}.options{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.option{min-height:76px;border:2px solid rgba(255,255,255,.34);border-radius:8px;padding:12px 16px;color:#111827;background:rgba(255,255,255,.95);box-shadow:0 12px 24px rgba(15,23,42,.22);display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;font-size:clamp(20px,2.3vw,31px);font-weight:1000}.option:disabled{opacity:.46;cursor:not-allowed}.option .letter{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:white;background:var(--dark);font-size:20px;font-weight:1000}.option.correct{border-color:#bbf7d0;background:#dcfce7;color:#14532d}.option.wrong{border-color:#fecdd3;background:#ffe4e6;color:#881337}.answer-line{min-height:34px;margin-top:14px;color:#fde68a;font-size:clamp(18px,2vw,26px);font-weight:1000}.buzzers{display:grid;grid-temp <body>
  <main class="app">
    <header class="topbar"><div><div class="kicker"><span class="dot"></span><span>抢答 PK 版</span></div><h1>课本单词抢答 PK</h1></div><section class="stats"><div class="stat"><span>总时间</span><strong id="totalLeft">120</strong></div><div class="stat"><span>作答</span><strong id="answerLeft">5</strong></div><div class="stat"><span>单词</span><strong id="wordCount">0</strong></div><div class="stat"><span>已答</span><strong id="doneCount">0</strong></div><div class="stat"><span>错题</span><strong id="missCount">0</strong></div></section></header>
    <section class="layout">
      <aside class="side">
        <section class="panel importer"><div class="panel-head"><h2>导入词库</h2><button class="btn secondary small" id="fileButton" type="button">选择文件</button></div><textarea id="rawImport" spellcheck="false"></textarea><input id="fileInput" class="hidden" type="file" accept=".txt,.csv" /><div class="import-actions"><button class="btn" id="importButton" type="button">倒入词库</button><button class="btn secondary" id="sampleButton" type="button">示例词库</button></div></section>
        <section class="panel settings"><div class="panel-head"><h2>比赛设置</h2></div><div class="setting-grid"><div class="field"><label for="redName">红方名称</label><input id="redName" value="红方" /></div><div class="field"><label for="blueName">蓝方名称</label><input id="blueName" value="蓝方" /></div><div class="field"><label for="totalTimeInput">总时长秒</label><input id="totalTimeInput" type="number" min="20" max="3600" value="120" /></div><div class="field"><label for="answerTimeInput">作答秒</label><input id="answerTimeInput" type="number" min="2" max="30" value="5" /></div></div></section>
        <section class="panel review"><div class="panel-head"><h2>错题复盘</h2><button class="btn secondary small" id="exportMissButton" type="button">导出</button></div><div class="bar"><span id="progressBar"></span></div><div class="miss-list" id="missList"></div></section>
      </aside>
      <section class="stage">
        <section class="scoreboard"><article class="team-card red" id="redCard"><div class="team-name"><span id="redLabel">红方</span><span>得分</span></div><strong class="score" id="redScore">0</strong></article><article class="center-clock"><strong class="clock-number" id="centerSeconds">120</strong><span class="clock-label" id="clockLabel">准备</span></article><article class="team-card blue" id="blueCard"><div class="team-name"><span id="blueLabel">蓝方</span><span>得分</span></div><strong class="score" id="blueScore">0</strong></article></section>
        <section class="arena"><div class="arena-split"><div class="red-field"></div><div class="vs-lane"><div class="vs-mark">VS</div></div><div class="blue-field"></div></div><div class="question-layer"><article class="quiz-card"><div class="status" id="statusBanner">等待开始</div><div class="word-meta" id="wordMeta"></div><div class="question-word" id="questionText">ready</div><div class="options" id="options"></div><div class="answer-line" id="answerLine"></div></article></div></section>
        <section class="panel buzzers"><button class="buzzer red" id="redBuzz" type="button">红方抢答</button><div class="tools"><button class="btn green icon" id="startButton" type="button" title="开始">开始</button><button class="btn secondary icon" id="nextButton" type="button" title="下一题">下一题</button><button class="btn secondary icon" id="pauseButton" type="button" title="暂停">暂停</button><button class="btn secondary icon" id="fullscreenButton" type="button" title="投屏">投屏</button><button class="btn secondary icon" id="resetButton" type="button" title="清零">清零</button></div><button class="buzzer blue" id="blueBuzz" type="button">蓝方抢答</button></section>
        <section class="word-drawer"><section class="panel word-bank"><div class="panel-head"><h2>当前词库</h2><button class="btn secondary small" id="exportButton" type="button">导出</button></div><div class="word-grid" id="wordGrid"></div></section><section class="panel word-bank"><div class="panel-head"><h2>单元统计</h2></div><div id="unitSummary"></div></section></section>
      </section>
    </section>
  </main>
  <div class="modal" id="reviewModal"><article class="review-card"><div class="review-word" id="reviewWord"></div><div class="review-meaning" id="reviewMeaning"></div><div class="review-example" id="reviewExample"></div><div class="review-actions"><button class="btn green" id="speakButton" type="button">播放读音</button><button class="btn secondary" id="closeReview" type="button">返回</button></div></article></div>
  <script>
    const sampleText=`Unit 1
wealthy | adj. 富有的 | a wealthy family
chat show | n. 访谈节目 | watch a chat show
guard | n. 警卫；看守 | a security guard
missing | adj. 丢失的；失踪的 | a missing child

Unit 2
business | n. 商业；生意 | run a business
peaceful | adj. 安宁的；和平的 | a peaceful village
method | n. 方法 | a useful method
chance | n. 机会 | a good chance`;
    const state={words:[],activeIndex:0,options:[],selectedIndex:null,totalTime:120,totalLeft:120,answerTime:5,answerLeft:5,redScore:0,blueScore:0,redName:"红方",blueName:"蓝方",phase:"ready",currentTeam:null,triedTeams:[],statusText:"等待开始",timer:null,answerTimer:null,autoTimer:null,reviewWord:null};
    const $=s=>document.querySelector(s);
    const el={rawImport:$("#rawImport"),fileInput:$("#fileInput"),fileButton:$("#fileButton"),importButton:$("#importButton"),sampleButton:$("#sampleButton"),redName:$("#redName"),blueName:$("#blueName"),totalTimeInput:$("#totalTimeInput"),answerTimeInput:$("#answerTimeInput"),totalLeft:$("#totalLeft"),answerLeft:$("#answerLeft"),wordCount:$("#wordCount"),doneCount:$("#doneCount"),missCount:$("#missCount"),progressBar:$("#progressBar"),redCard:$("#redCard"),blueCard:$("#blueCard"),redLabel:$("#redLabel"),blueLabel:$("#blueLabel"),redScore:$("#redScore"),blueScore:$("#blueScore"),centerSeconds:$("#centerSeconds"),clockLabel:$("#clockLabel"),statusBanner:$("#statusBanner"),wordMeta:$("#wordMeta"),questionText:$("#questionText"),options:$("#options"),answerLine:$("#answerLine"),redBuzz:$("#redBuzz"),blueBuzz:$("#blueBuzz"),startButton:$("#startButton"),nextButton:$("#nextButton"),pauseButton:$("#pauseButton"),fullscreenButton:$("#fullscreenButton"),resetButton:$("#resetButton"),exportButton:$("#exportButton"),exportMissButton:$("#exportMissButton"),wordGrid:$("#wordGrid"),unitSummary:$("#unitSummary"),missList:$("#missList"),reviewModal:$("#reviewModal"),reviewWord:$("#reviewWord"),reviewMeaning:$("#reviewMeaning"),reviewExample:$("#reviewExample"),speakButton:$("#speakButton"),closeReview:$("#closeReview")};
    function word(text,meaning,unit,example){return{id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,word:text,meaning:meaning||"待补充释义",unit:unit||"未分组",example:example||"",misses:0,wins:0,attempts:0}}
    function parseWords(raw){let unit="未分组";return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).flatMap(line=>{const clean=line.replace(/^[-*]\s*/,"");if(/^(unit|module|lesson|book)\s*[\w\d\u4e00-\u9fa5 -]*$/i.test(clean)){unit=clean;return[]}const p=clean.split(/\s*(?:\||\t|，|；|;)\s*/).map(x=>x.trim()).filter(Boolean);let term=p[0]||"",meaning=p[1]||"",example=p[2]||"",u=p[3]||unit;if(p.length===1){const m=clean.match(/^([A-Za-z][A-Za-z .'-]+)\s+(.+)$/);if(m){term=m[1].trim();meaning=m[2].trim()}}return term?[word(term,meaning,u,example)]:[]})}
    function normalize(words){return words.map(x=>({id:x.id||`${Date.now()}-${Math.random()}`,word:x.word,meaning:x.meaning||"待补充释义",unit:x.unit||"未分组",example:x.example||"",misses:x.misses||0,wins:x.wins||0,attempts:x.attempts||0}))}
    function activeWord(){return state.words[state.activeIndex]||word("ready","请先导入词库","课堂","")}
    function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function makeOptions(){const cur=activeWord();const pool=shuffle([...new Set(state.words.filter(x=>x.id!==cur.id).map(x=>x.meaning).filter(x=>x&&x!==cur.meaning))]);state.options=[{text:cur.meaning,correct:true}];while(state.options.length<4&&pool.length)state.options.push({text:pool.shift(),correct:false});while(state.options.length<4)state.options.push({text:`干扰项 ${state.options.length}`,correct:false});state.options=shuffle(state.options);state.selectedIndex=null}
    function save(){localStorage.setItem("word-pk-buzzer-v1",JSON.stringify({words:state.words,activeIndex:state.activeIndex,totalTime:state.totalTime,answerTime:state.answerTime,redScore:state.redScore,blueScore:state.blueScore,redName:state.redName,blueName:state.blueName}))}
    function load(){const saved=localStorage.getItem("word-pk-buzzer-v1")||localStorage.getItem("word-pk-choice-v1");if(saved){try{const d=JSON.parse(saved);state.words=Array.isArray(d.words)&&d.words.length?normalize(d.words):parseWords(sampleText);state.activeIndex=Math.min(d.activeIndex||0,state.words.length-1);state.totalTime=d.totalTime||120;state.answerTime=d.answerTime||5;state.redScore=d.redScore||0;state.blueScore=d.blueScore||0;state.redName=d.redName||"红方";state.blueName=d.blueName||"蓝方"}catch{state.words=parseWords(sampleText)}}else state.words=parseWords(sampleText);state.totalLeft=state.totalTime;state.answerLeft=state.answerTime;el.rawImport.value=sampleText;el.redName.value=state.redName;el.blueName.value=state.blueName;el.totalTimeInput.value=state.totalTime;el.answerTimeInput.value=state.answerTime;makeOptions()}
    function startGame(){clearAllTimers();state.totalTime=limit(+el.totalTimeInput.value||120,20,3600);state.answerTime=limit(+el.answerTimeInput.value||5,2,30);state.totalLeft=state.totalTime;state.answerLeft=state.answerTime;state.phase="buzz";state.statusText="等待抢答";state.currentTeam=null;state.triedTeams=[];makeOptions();state.timer=setInterval(()=>{state.totalLeft=Math.max(0,state.totalLeft-1);if(state.totalLeft===0)endGame();render()},1000);render()}
    function clearAllTimers(){clearInterval(state.timer);clearInterval(state.answerTimer);clearTimeout(state.autoTimer);state.timer=state.answerTimer=state.autoTimer=null}
    function pauseGame(){if(state.phase==="paused"){state.phase=state.currentTeam?"answering":"buzz";state.statusText=state.currentTeam?`${teamName(state.currentTeam)}继续作答`:"等待抢答";state.timer=setInterval(()=>{state.totalLeft=Math.max(0,state.totalLeft-1);if(state.totalLeft===0)endGame();render()},1000);if(state.currentTeam)startAnswerTimer(false)}else{clearInterval(state.timer);clearInterval(state.answerTimer);state.timer=state.answerTimer=null;state.phase="paused";state.statusText="已暂停"}render()}
    function buzz(team){if(state.phase!=="buzz")return;state.currentTeam=team;state.triedTeams=[team];state.answerLeft=state.answerTime;state.phase="answering";state.statusText=`${teamName(team)}抢答成功`;startAnswerTimer(true);render()}
    function startAnswerTimer(reset){clearInterval(state.answerTimer);if(reset)state.answerLeft=state.answerTime;state.answerTimer=setInterval(()=>{state.answerLeft=Math.max(0,state.answerLeft-1);if(state.answerLeft===0)answerTimeout();render()},1000)}
    function answerTimeout(){clearInterval(state.answerTimer);state.answerTimer=null;const other=state.currentTeam==="red"?"blue":"red";if(!state.triedTeams.includes(other)){state.currentTeam=other;state.triedTeams.push(other);state.answerLeft=state.answerTime;state.phase="answering";state.statusText=`${teamName(other)}作答`;startAnswerTimer(true);return}markQuestionMissed("双方未作答，本题作废")}
    function chooseOption(index){if(state.phase!=="answering"||state.selectedIndex!==null)return;clearInterval(state.answerTimer);state.answerTimer=null;const cur=activeWord(),opt=state.options[index];state.selectedIndex=index;cur.attempts++;if(opt.correct){cur.wins++;addScore(state.currentTeam,1);state.statusText=`${teamName(state.currentTeam)}答对 +1`;state.phase="reveal"}else{cur.misses++;addScore(state.currentTeam,-1);state.statusText=`${teamName(state.currentTeam)}答错 -1`;state.phase="reveal"}autoNext()}
    function markQuestionMissed(text){const cur=activeWord();cur.attempts++;cur.misses++;state.selectedIndex=-1;state.phase="reveal";state.statusText=text;autoNext()}
    function autoNext(){render();state.autoTimer=setTimeout(nextQuestion,1200)}
    function nextQuestion(){clearTimeout(state.autoTimer);clearInterval(state.answerTimer);state.autoTimer=state.answerTimer=null;if(state.totalLeft<=0){endGame();return}if(state.words.length>1){let n=Math.floor(Math.random()*state.words.length);while(n===state.activeIndex)n=Math.floor(Math.random()*state.words.length);state.activeIndex=n}state.phase="buzz";state.currentTeam=null;state.triedTeams=[];state.answerLeft=state.answerTime;state.statusText="等待抢答";makeOptions();render()}
    function endGame(){clearAllTimers();state.phase="ended";state.currentTeam=null;state.statusText=`比赛结束：${winnerText()}`;render()}
    function winnerText(){if(state.redScore===state.blueScore)return"平局";return state.redScore>state.blueScore?`${state.redName}领先`:`${state.blueName}领先`}
    function addScore(team,n){if(team==="red")state.redScore+=n;if(team==="blue")state.blueScore+=n}
    function resetMatch(){clearAllTimers();state.redScore=0;state.blueScore=0;state.totalLeft=state.totalTime;state.answerLeft=state.answerTime;state.phase="ready";state.currentTeam=null;state.statusText="等待开始";state.words=state.words.map(x=>({...x,misses:0,wins:0,attempts:0}));makeOptions();render()}
    function loadWords(words){if(!words.length)return;clearAllTimers();state.words=words;state.activeIndex=0;state.phase="ready";state.statusText="等待开始";state.totalLeft=state.totalTime;state.answerLeft=state.answerTime;makeOptions();render()}
    function render(){const cur=activeWord(),misses=state.words.filter(x=>x.misses>0),done=state.words.reduce((s,x)=>s+x.attempts,0),units=new Map();state.words.forEach(x=>units.set(x.unit||"未分组",(units.get(x.unit||"未分组")||0)+1));el.totalLeft.textContent=state.totalLeft;el.answerLeft.textContent=state.answerLeft;el.wordCount.textContent=state.words.length;el.doneCount.textContent=done;el.missCount.textContent=misses.length;el.progressBar.style.width=`${Math.round(done/Math.max(state.words.length,1)*100)}%`;el.redScore.textContent=state.redScore;el.blueScore.textContent=state.blueScore;el.redLabel.textContent=state.redName;el.blueLabel.textContent=state.blueName;el.centerSeconds.textContent=state.phase==="answering"?state.answerLeft:state.totalLeft;el.clockLabel.textContent=state.phase==="answering"?"作答倒计时":state.phase==="ended"?"结束":"总倒计时";el.redCard.classList.toggle("active",state.currentTeam==="red");el.blueCard.classList.toggle("active",state.currentTeam==="blue");el.redBuzz.classList.toggle("active",state.currentTeam==="red");el.blueBuzz.classList.toggle("active",state.currentTeam==="blue");el.statusBanner.textContent=state.statusText;el.statusBanner.className=`status ${state.currentTeam||""} ${state.phase==="reveal"?"done":""} ${state.statusText.includes("作废")?"warn":""}`;el.wordMeta.innerHTML="";[cur.unit||"未分组",state.phase==="answering"?`${teamName(state.currentTeam)}作答中`:"先抢答再作答"].forEach(t=>appendMeta(t));el.questionText.textContent=cur.word;el.options.innerHTML=state.options.map((o,i)=>{let cls="";if(state.selectedIndex!==null){if(o.correct)cls="correct";if(state.selectedIndex===i&&!o.correct)cls="wrong"}return`<button class="option ${cls}" type="button" data-option="${i}" ${state.phase==="answering"?"":"disabled"}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></button>`}).join("");const correct=state.options.find(o=>o.correct);el.answerLine.textContent=state.selectedIndex===null?"":`答案：${correct?correct.text:cur.meaning}`;el.wordGrid.innerHTML=state.words.map((x,i)=>`<button class="word-item ${i===state.activeIndex?"active":""}" type="button" data-index="${i}"><strong>${esc(x.word)}</strong><span>${esc(x.meaning)}</span></button>`).join("");el.unitSummary.innerHTML=Array.from(units.entries()).map(([u,c])=>`<div class="unit-row"><div><strong>${esc(u)}</strong><span>${c} 个单词</span></div><b class="badge">${c}</b></div>`).join("");el.missList.innerHTML=misses.length?misses.map((x,i)=>`<div class="miss-row"><button type="button" data-miss="${i}"><strong>${esc(x.word)}</strong><span>${esc(x.meaning)}</span></button><b class="badge">${x.misses}</b></div>`).join(""):`<div class="empty">还没有错题</div>`;save()}
    function appendMeta(t){const s=document.createElement("span");s.textContent=t;el.wordMeta.appendChild(s)}
    function teamName(t){return t==="red"?state.redName:state.blueName}
    function limit(n,min,max){return Math.min(Math.max(n,min),max)}
    function esc(t){return String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function exportCsv(onlyMisses=false){const list=onlyMisses?state.words.filter(x=>x.misses>0):state.words;const rows=list.map(x=>[x.unit,x.word,x.meaning,x.example,x.misses,x.wins,x.attempts].map(c=>`"${String(c??"").replaceAll('"','""')}"`).join(","));const blob=new Blob([`\ufeff单元,单词,释义,例句,错题次数,答对次数,作答次数\n${rows.join("\n")}`],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=onlyMisses?"错词复盘.csv":"课本单词库.csv";a.click();URL.revokeObjectURL(url)}
    function openReview(item){state.reviewWord=item;el.reviewWord.textContent=item.word;el.reviewMeaning.textContent=item.meaning;el.reviewExample.textContent=item.example||item.unit||"";el.reviewModal.classList.add("show");speak(item.word)}
    function speak(text){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
    el.importButton.onclick=()=>loadWords(parseWords(el.rawImport.value));el.sampleButton.onclick=()=>{el.rawImport.value=sampleText;loadWords(parseWords(sampleText))};el.fileButton.onclick=()=>el.fileInput.click();el.fileInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();el.rawImport.value=text;loadWords(parseWords(text))};el.redName.oninput=()=>{state.redName=el.redName.value.trim()||"红方";render()};el.blueName.oninput=()=>{state.blueName=el.blueName.value.trim()||"蓝方";render()};el.totalTimeInput.onchange=()=>{state.totalTime=limit(+el.totalTimeInput.value||120,20,3600);state.totalLeft=state.totalTime;render()};el.answerTimeInput.onchange=()=>{state.answerTime=limit(+el.answerTimeInput.value||5,2,30);state.answerLeft=state.answerTime;render()};el.startButton.onclick=startGame;el.pauseButton.onclick=pauseGame;el.nextButton.onclick=nextQuestion;el.resetButton.onclick=resetMatch;el.fullscreenButton.onclick=()=>document.body.classList.toggle("fullscreen");el.redBuzz.onclick=()=>buzz("red");el.blueBuzz.onclick=()=>buzz("blue");el.exportButton.onclick=()=>exportCsv(false);el.exportMissButton.onclick=()=>exportCsv(true);el.options.onclick=e=>{const b=e.target.closest("[data-option]");if(b)chooseOption(+b.dataset.option)};el.wordGrid.onclick=e=>{const b=e.target.closest("[data-index]");if(!b)return;clearAllTimers();state.activeIndex=+b.dataset.index;state.phase="ready";state.statusText="等待开始";state.currentTeam=null;makeOptions();render()};el.missList.onclick=e=>{const b=e.target.closest("[data-miss]");if(!b)return;openReview(state.words.filter(x=>x.misses>0)[+b.dataset.miss])};el.speakButton.onclick=()=>state.reviewWord&&speak(state.reviewWord.word);el.closeReview.onclick=()=>el.reviewModal.classList.remove("show");el.reviewModal.onclick=e=>{if(e.target===el.reviewModal)el.reviewModal.classList.remove("show")};
    load();render();
  </script>
</body>
