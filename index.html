<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课本单词PK</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#0f172a;background:linear-gradient(135deg,#fff7ed,#f8fbff 50%,#eef8f1);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1480px;margin:auto;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:16px}header{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;border-bottom:1px solid #dbe2ea;padding-bottom:16px}.pill{display:inline-block;background:#fef3c7;color:#78350f;border:1px solid #fbbf24;border-radius:999px;padding:6px 12px;font-weight:800}h1{margin:8px 0 0;font-size:clamp(32px,5vw,58px);line-height:1.04}h2,p{margin:0}.stats{display:grid;grid-template-columns:repeat(3,90px);gap:8px;background:#ffffffc9;border:1px solid #dbe2ea;border-radius:8px;padding:8px}.stat{padding:8px}.stat span{font-size:14px;color:#64748b}.stat strong{display:block;font-size:30px}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;flex:1}.panel{background:#ffffffd9;border:1px solid #dbe2ea;border-radius:8px;box-shadow:0 10px 28px #0f172a12}.side{display:grid;gap:16px;align-content:start}.box{padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}textarea{width:100%;min-height:200px;resize:vertical;border:1px solid #cbd5e1;border-radius:8px;padding:12px;background:#fff;font-size:16px;line-height:1.6}.btn{min-height:42px;border:1px solid transparent;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:white;background:#0f172a;font-weight:900}.btn.secondary{background:white;color:#0f172a;border-color:#cbd5e1}.btn.red{background:#dc2626}.btn.blue{background:#2563eb}.btn.green{background:#059669}.actions{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:14px}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f97316,#22c55e)}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;margin-top:8px}.badge{border-radius:999px;background:#fff;padding:4px 9px;font-size:14px;font-weight:900;color:#475569}.arenaWrap{display:grid;gap:16px;grid-template-rows:auto minmax(520px,1fr) auto}.score{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{border-radius:8px;padding:16px;border:2px solid}.team.red{border-color:#dc262640;background:#fef2f2;color:#b91c1c}.team.blue{text-align:right;border-color:#2563eb40;background:#eff6ff;color:#1d4ed8}.team span{font-weight:900}.team strong{display:block;font-size:clamp(58px,8vw,92px);line-height:.95}.arena{position:relative;min-height:520px;overflow:hidden;border-radius:8px;border:1px solid #dbe2ea;background:white;box-shadow:0 18px 40px #0f172a24}.arenaBg{position:absolute;inset:0;display:grid;grid-template-columns:1fr 178px 1fr}.redZone{background:linear-gradient(135deg,#dc2626,#fb7185)}.blueZone{background:linear-gradient(135deg,#2563eb,#38bdf8)}.timerCol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:white;border-inline:1px solid #cbd5e1;padding:16px}.timer{width:130px;height:130px;display:grid;place-items:center;border-radius:999px;border:8px solid #f1f5f9;background:#0f172a;color:white;font-size:54px;font-weight:1000}.timerInput{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;font-size:18px;font-weight:900}.card{position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none}.qcard{width:min(760px,100%);pointer-events:auto;text-align:center;color:white;background:#0f172a;border:4px solid white;border-radius:8px;box-shadow:0 24px 60px #0f172a59;padding:clamp(20px,4vw,34px)}.meta{min-height:32px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}.meta span{border-radius:999px;background:#ffffff1a;padding:6px 12px;font-size:14px;font-weight:900}.meta .rw{background:#dc2626}.meta .bw{background:#2563eb}.word{overflow-wrap:anywhere;font-size:clamp(48px,8vw,90px);line-height:1;font-weight:1000}.answer{margin-top:22px;min-height:96px;border-radius:8px;background:#ffffff14;padding:16px}.meaning{color:#fde68a;font-size:clamp(24px,3.4vw,38px);font-weight:1000}.example{margin-top:8px;color:#ffffffbf;font-size:20px}.waiting{display:grid;min-height:64px;place-items:center;color:#ffffff61;font-size:28px;font-weight:900}.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;padding:12px}.tools{display:grid;grid-template-columns:repeat(4,64px);gap:8px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid{display:grid;max-height:220px;overflow:auto;gap:8px;grid-template-columns:repeat(3,1fr)}.item{text-align:left;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a;border-radius:8px;padding:10px 12px}.item.active{background:#0f172a;color:#fff}.item strong,.item span,.row strong,.row p{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item span{margin-top:3px;opacity:.68;font-size:14px}.miss{background:#fff1f2;border-color:#fecdd3}.miss p{color:#9f1239;font-size:14px}.empty{min-height:110px;display:grid;place-items:center;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;color:#64748b;font-weight:800}.hidden{display:none}@media(max-width:1100px){header,.layout,.bottom{grid-template-columns:1fr}.arenaBg{grid-template-columns:1fr}.redZone,.blueZone{display:none}.timerCol{position:absolute;inset:auto 0 0;flex-direction:row;border-top:1px solid #cbd5e1}.timer{width:92px;height:92px;font-size:38px}.timerInput{width:96px}}@media(max-width:700px){.app{padding:10px}.stats,.score,.controls,.grid{grid-template-columns:1fr}.tools{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
<header><div><div class="pill">课本单词 PK</div><h1>把整本书单词倒进去，课堂直接开战</h1></div><section class="stats"><div class="stat"><span>单词</span><strong id="wc">0</strong></div><div class="stat"><span>已过</span><strong id="dc">0</strong></div><div class="stat"><span>错词</span><strong id="mc">0</strong></div></section></header>
<section class="layout"><aside class="side"><section class="panel box"><div class="head"><h2>导入单词库</h2><button class="btn secondary" id="fileBtn">文件</button></div><textarea id="raw" spellcheck="false"></textarea><input id="file" class="hidden" type="file" accept=".txt,.csv"><div class="actions"><button class="btn" id="importBtn">倒入</button><button class="btn secondary" id="exportBtn">导出</button></div></section><section class="panel box"><div class="head"><h2>课本进度</h2><strong id="pt">0%</strong></div><div class="bar"><span id="pb"></span></div><div id="units"></div></section></aside>
<section class="arenaWrap"><section class="score"><div class="team red"><span>红队</span><strong id="rs">0</strong></div><div class="team blue"><span>蓝队</span><strong id="bs">0</strong></div></section><section class="arena"><div class="arenaBg"><div class="redZone"></div><div class="timerCol"><div class="timer" id="sec">30</div><button class="btn green" id="start">开始</button><input class="timerInput" id="rt" type="number" min="10" max="180" value="30"></div><div class="blueZone"></div></div><div class="card"><article class="qcard"><div class="meta" id="meta"></div><div class="word" id="word">ready</div><div class="answer" id="ans"></div></article></div></section><section class="panel controls"><button class="btn red" id="redOk">红队答对</button><div class="tools"><button class="btn secondary" id="next">抽</button><button class="btn secondary" id="show">看</button><button class="btn secondary" id="wrong">错</button><button class="btn secondary" id="reset">清</button></div><button class="btn blue" id="blueOk">蓝队答对</button></section></section></section>
<section class="bottom"><section class="panel box"><div class="head"><h2>当前词库</h2></div><div class="grid" id="wg"></div></section><section class="panel box"><div class="head"><h2>错词复盘</h2><button class="btn secondary" id="exportMiss">导出</button></div><div id="miss"></div></section></section>
</main>
<script>
const sample=`Unit 1
wealthy | adj. 富有的 | a wealthy family
chat show | n. 访谈节目 | watch a chat show

Unit 2
business | n. 商业；生意 | run a business
peaceful | adj. 安宁的；和平的 | a peaceful village`;
const $=s=>document.querySelector(s);const E={raw:$('#raw'),file:$('#file'),fileBtn:$('#fileBtn'),importBtn:$('#importBtn'),exportBtn:$('#exportBtn'),exportMiss:$('#exportMiss'),wc:$('#wc'),dc:$('#dc'),mc:$('#mc'),pt:$('#pt'),pb:$('#pb'),units:$('#units'),rs:$('#rs'),bs:$('#bs'),sec:$('#sec'),start:$('#start'),rt:$('#rt'),meta:$('#meta'),word:$('#word'),ans:$('#ans'),redOk:$('#redOk'),blueOk:$('#blueOk'),next:$('#next'),show:$('#show'),wrong:$('#wrong'),reset:$('#reset'),wg:$('#wg'),miss:$('#miss')};
function W(a,b,c,d){return{id:Date.now()+Math.random(),word:a,meaning:b,unit:c,examples:d,misses:0,wins:0}}let S={words:[W('wealthy','adj. 富有的','Unit 1','a wealthy family'),W('chat show','n. 访谈节目','Unit 1','watch a chat show'),W('business','n. 商业；生意','Unit 2','run a business'),W('peaceful','adj. 安宁的；和平的','Unit 2','a peaceful village'),W('conversation','n. 谈话；交谈','Unit 3','have a conversation')],i:0,show:false,sec:30,rt:30,run:false,red:0,blue:0,win:null,t:null};
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function cur(){return S.words[S.i]||S.words[0]}function parse(raw){let u='未分组';return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).flatMap(line=>{if(/^(unit|module|lesson|book)\s*[\w\d\u4e00-\u9fa5 -]*$/i.test(line)){u=line;return[]}let p=line.split(/\s*(?:\||,|\t|，|；|;)\s*/).map(x=>x.trim()).filter(Boolean);return p[0]?[W(p[0],p[1]||'待补充释义',p[3]||u,p[2]||'')]:[]})}
function save(){localStorage.setItem('word-pk-state',JSON.stringify({words:S.words,red:S.red,blue:S.blue,rt:S.rt}))}function load(){E.raw.value=sample;try{let p=JSON.parse(localStorage.getItem('word-pk-state')||'{}');if(p.words?.length)S.words=p.words;S.red=p.red||0;S.blue=p.blue||0;S.rt=p.rt||30;S.sec=S.rt;E.rt.value=S.rt}catch{}}
function render(){let m=S.words.filter(x=>x.misses>0),done=S.words.reduce((a,b)=>a+b.wins,0),prog=Math.round(done/Math.max(S.words.length,1)*100),c=cur();E.wc.textContent=S.words.length;E.dc.textContent=done;E.mc.textContent=m.length;E.pt.textContent=prog+'%';E.pb.style.width=prog+'%';E.rs.textContent=S.red;E.bs.textContent=S.blue;E.sec.textContent=S.sec;E.start.textContent=S.run?'暂停':'开始';E.meta.innerHTML='<span>'+esc(c.unit)+'</span>'+(S.win==='red'?'<span class="rw">红队得分</span>':S.win==='blue'?'<span class="bw">蓝队得分</span>':'');E.word.textContent=c.word;E.ans.innerHTML=S.show?'<p class="meaning">'+esc(c.meaning)+'</p>'+(c.examples?'<p class="example">'+esc(c.examples)+'</p>':''):'<div class="waiting">等待抢答</div>';let units=new Map;S.words.forEach(x=>units.set(x.unit,(units.get(x.unit)||0)+1));E.units.innerHTML=[...units].map(([u,n])=>'<div class="row"><strong>'+esc(u)+'</strong><span class="badge">'+n+'</span></div>').join('');E.wg.innerHTML=S.words.map((x,i)=>'<button class="item '+(i===S.i?'active':'')+'" data-i="'+i+'"><strong>'+esc(x.word)+'</strong><span>'+esc(x.meaning)+'</span></button>').join('');E.miss.innerHTML=m.length?m.map(x=>'<div class="row miss"><div><strong>'+esc(x.word)+'</strong><p>'+esc(x.meaning)+'</p></div><span class="badge">'+x.misses+'</span></div>').join(''):'<div class="empty">还没有错词</div>';save()}
function stop(){if(S.t)clearInterval(S.t);S.t=null;S.run=false}function start(){stop();S.run=true;S.t=setInterval(()=>{S.sec--;if(S.sec<=0){S.sec=0;stop()}render()},1000)}function next(){if(S.words.length>1){let n=Math.floor(Math.random()*S.words.length);while(n===S.i)n=Math.floor(Math.random()*S.words.length);S.i=n}S.show=false;S.win=null;S.sec=S.rt;start();render()}function ok(team){cur().wins++;team==='red'?S.red++:S.blue++;S.win=team;S.show=true;stop();render()}function wrong(){cur().misses++;S.show=true;stop();render()}function reset(){S.red=0;S.blue=0;S.win=null;S.sec=S.rt;S.show=false;S.words=S.words.map(x=>({...x,misses:0,wins:0}));stop();render()}function exp(){let m=S.words.filter(x=>x.misses>0),list=m.length?m:S.words,c=list.map(x=>[x.unit,x.word,x.meaning,x.examples].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),b=new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=m.length?'错词复盘.csv':'单词库.csv';a.click();URL.revokeObjectURL(u)}
E.importBtn.onclick=()=>{let w=parse(E.raw.value);if(w.length){S.words=w;S.i=0;S.show=false;S.win=null;S.sec=S.rt;stop();render()}};E.fileBtn.onclick=()=>E.file.click();E.file.onchange=async e=>{let f=e.target.files[0];if(f){let t=await f.text();E.raw.value=t;let w=parse(t);if(w.length){S.words=w;S.i=0;render()}}};E.exportBtn.onclick=exp;E.exportMiss.onclick=exp;E.start.onclick=()=>{S.run?stop():start();render()};E.rt.onchange=()=>{S.rt=Math.min(Math.max(Number(E.rt.value)||30,10),180);S.sec=S.rt;render()};E.redOk.onclick=()=>ok('red');E.blueOk.onclick=()=>ok('blue');E.next.onclick=next;E.show.onclick=()=>{S.show=!S.show;render()};E.wrong.onclick=wrong;E.reset.onclick=reset;E.wg.onclick=e=>{let b=e.target.closest('[data-i]');if(b){S.i=Number(b.dataset.i);S.show=false;S.sec=S.rt;S.win=null;render()}};load();render();
</script>
</body>
</html>
