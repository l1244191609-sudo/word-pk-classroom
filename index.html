<style>

adding:14px;border:3px solid transparent;background:white;box-shadow:var(--shadow);transition:.12s}.team.red{color:#9f1239;border-color:rgba(225,29,72,.28);background:linear-gradient(135deg,#fff1f2,#fff)}.team.blue{color:#1e3a8a;border-color:rgba(37,99,235,.28);background:linear-gradient(135deg,#eff6ff,#fff);text-align:right}.team.active{transform:translateY(-2px);border-color:currentColor}.teamname{display:flex;justify-content:space-between;gap:10px;font-size:clamp(18px,2.1vw,30px);font-weight:1000}.blue .teamname{flex-direction:row-reverse}.score{display:block;font-size:clamp(58px,8vw,108px);line-height:.9;font-weight:1000;font-variant-numeric:tabular-nums}.clock{min-width:176px;border-radius:8px;padding:10px 14px;display:grid;place-items:center;color:white;background:var(--dark);box-shadow:var(--shadow)}.clock strong{font-size:clamp(52px,6vw,86px);line-height:.9;font-weight:1000;font-variant-numeric:tabular-nums}.clock span{color:rgba(255,255,255,.72);font-size:14px;font-weight:900}.arena{position:relative;min-height:500px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:white;box-shadow:var(--shadow)}.split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 124px 1fr}.redfield{background:linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(135deg,#be123c,#fb7185);background-size:44px 44px,44px 44px,auto}.bluefield{background:linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(135deg,#1d4ed8,#38bdf8);background-size:44px 44px,44px 44px,auto}.vs{display:grid;place-items:center;background:white}.vs b{width:84px;height:84px;display:grid;place-items:center;border-radius:50%;color:white;background:linear-gradient(135deg,var(--red),var(--blue));border:5px solid white;box-shadow:0 12px 30px rgba(16,24,40,.28);font-size:30px}.layer{position:absolute;inset:0;display:grid;place-items:center;padding:22px}.quiz{width:min(920px,100%);border:4px solid white;border-radius:8px;padding:clamp(18px,3vw,32px);color:white;background:rgba(15,23,42,.94);box-shadow:0 24px 68px rgba(16,24,40,.38);text-align:center}.meta{min-height:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.meta span{border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.12);font-size:14px;font-weight:900}.meta .ok{background:var(--green)}.meta .bad{background:#b45309}.q{margin-top:14px;min-height:1.05em;overflow-wrap:anywhere;font-size:clamp(54px,9vw,126px);line-height:1.02;font-weight:1000}.opts{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.opt{min-height:82px;border:2px solid rgba(255,255,255,.34);border-radius:8px;padding:12px 16px;color:#111827;background:rgba(255,255,255,.94);box-shadow:0 12px 24px rgba(16,24,40,.22);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;font-size:clamp(20px,2.4vw,32px);font-weight:1000}.letter{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:white;background:var(--dark);font-size:20px}.opt.correct{border-color:#bbf7d0;background:#dcfce7;color:#14532d}.opt.wrong{border-color:#fecdd3;background:#ffe4e6;color:#881337}.answer{min-height:34px;margin-top:14px;color:#fde68a;font-size:clamp(18px,2vw,26px);font-weight:1000}.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px;align-items:center}.turn{min-height:54px;border-radius:8px;border:3px solid transparent;color:white;font-size:clamp(18px,2vw,26px);font-weight:1000}.turn.red{background:var(--red)}.turn.blue{background:var(--blue)}.turn.active{border-color:#111827;box-shadow:0 0 0 4px rgba(17,24,39,.12)}.tools{display:grid;grid-template-columns:repeat(5,54px);gap:8px}.drawer{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:174px}.words{max-height:204px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-right:4px}.worditem{min-height:58px;border:1px solid #e4e7ec;border-radius:8px;padding:8px 10px;background:white;color:var(--ink);text-align:left}.worditem.active{color:white;background:var(--dark);border-color:var(--dark)}.worditem strong,.worditem span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.worditem span{margin-top:2px;opacity:.68;font-size:13px}.empty{min-height:96px;display:grid;place-items:center;border:1px dashed #cbd5e1;border-radius:8px;color:var(--muted);background:#f8fafc;font-weight:900}body.fullscreen .top,body.fullscreen .side,body.fullscreen .drawer{display:none}body.fullscreen .app{max-width:none;padding:8px}body.fullscreen .layout{grid-template-columns:1fr}body.fullscreen .stage{grid-template-rows:auto minmax(0,1fr) auto}body.fullscreen .arena{min-height:calc(100vh - 260px)}@media(max-width:1180px){.top,.layout,.drawer{grid-template-columns:1fr}.side{grid-template-rows:auto auto auto}}@media(max-width:760px){.app{padding:8px}.top,.scoreboard,.pick,.stats,.grid2{grid-template-columns:1fr}.team.blue{text-align:left}.blue .teamname{flex-direction:row}.split{grid-template-columns:1fr}.redfield,.bluefield{display:none}.vs{background:linear-gradient(135deg,#be123c,#1d4ed8)}.opts{grid-template-columns:1fr}.tools{grid-template-columns:repeat(5,minmax(0,1fr))}.words{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<main class="app">
<header class="top"><div><div class="kicker"><span class="dot"></span><span>四选项 PK 版</span></div><h1>课本单词 PK</h1></div><section class="stats"><div class="stat"><span>单词</span><strong id="wordCount">0</strong></div><div class="stat"><span>已答</span><strong id="doneCount">0</strong></div><div class="stat"><span>错题</span><strong id="missCount">0</strong></div><div class="stat"><span>单元</span><strong id="unitCount">0</strong></div></section></header>
<section class="layout"><aside class="side"><section class="panel box"><div class="head"><h2>导入词库</h2><button class="btn secondary small" id="fileBtn">选择文件</button></div><textarea id="raw" spellcheck="false"></textarea><input id="file" class="hidden" type="file" accept=".txt,.csv"><div class="grid2"><button class="btn" id="importBtn">倒入词库</button><button class="btn secondary" id="sampleBtn">示例词库</button></div></section><section class="panel box"><div class="head"><h2>上课设置</h2></div><div class="grid2"><div class="field"><label>红队名称</label><input id="redName" value="红队"></div><div class="field"><label>蓝队名称</label><input id="blueName" value="蓝队"></div><div class="field"><label>每题秒数</label><input id="time" type="number" min="5" max="180" value="30"></div><div class="field"><label>选项数量</label><input id="optCount" type="number" min="2" max="6" value="4"></div></div></section><section class="panel box review"><div class="head"><h2>错词复盘</h2><button class="btn secondary small" id="exportMiss">导出</button></div><div class="bar"><span id="bar"></span></div><div class="list" id="missList"></div></section></aside>
<section class="stage"><section class="scoreboard"><article class="team red" id="redCard"><div class="teamname"><span id="redLabel">红队</span><span>当前作答</span></div><strong class="score" id="redScore">0</strong></article><article class="clock"><strong id="seconds">30</strong><span id="clockText">准备</span></article><article class="team blue" id="blueCard"><div class="teamname"><span id="blueLabel">蓝队</span><span>当前作答</span></div><strong class="score" id="blueScore">0</strong></article></section><section class="arena"><div class="split"><div class="redfield"></div><div class="vs"><b>VS</b></div><div class="bluefield"></div></div><div class="layer"><article class="quiz"><div class="meta" id="meta"></div><div class="q" id="question">ready</div><div class="opts" id="opts"></div><div class="answer" id="answer"></div></article></div></section><section class="panel pick"><button class="turn red active" id="redTurn">红队作答</button><div class="tools"><button class="btn green icon" id="start">开始</button><button class="btn secondary icon" id="next">抽题</button><button class="btn secondary icon" id="wrong">扣分</button><button class="btn secondary icon" id="screen">投屏</button><button class="btn secondary icon" id="reset">清零</button></div><button class="turn blue" id="blueTurn">蓝队作答</button></section><section class="drawer"><section class="panel box"><div class="head"><h2>当前词库</h2><button class="btn secondary small" id="exportAll">导出</button></div><div class="words" id="wordGrid"></div></section><section class="panel box"><div class="head"><h2>单元统计</h2></div><div id="units"></div></section></section></section></section></main>
<script>
const sample=`Unit 1
wealthy | adj. 富有的 | a wealthy family
chat show | n. 访谈节目 | watch a chat show
guard | n. 警卫；看守 | a security guard
missing | adj. 丢失的；失踪的 | a missing child

Unit 2
business | n. 商业；生意 | run a business
peaceful | adj. 安宁的；和平的 | a peaceful village
method | n. 方法 | a useful method
chance | n. 机会 | a good chance`;
const $=s=>document.querySelector(s),E={raw:$("#raw"),file:$("#file"),wordCount:$("#wordCount"),doneCount:$("#doneCount"),missCount:$("#missCount"),unitCount:$("#unitCount"),bar:$("#bar"),redCard:$("#redCard"),blueCard:$("#blueCard"),redLabel:$("#redLabel"),blueLabel:$("#blueLabel"),redScore:$("#redScore"),blueScore:$("#blueScore"),seconds:$("#seconds"),clockText:$("#clockText"),meta:$("#meta"),question:$("#question"),opts:$("#opts"),answer:$("#answer"),redTurn:$("#redTurn"),blueTurn:$("#blueTurn"),redName:$("#redName"),blueName:$("#blueName"),time:$("#time"),optCount:$("#optCount"),wordGrid:$("#wordGrid"),units:$("#units"),missList:$("#missList")};
const S={words:[],active:0,options:[],selected:null,seconds:30,roundTime:30,optCount:4,running:false,redScore:0,blueScore:0,redName:"红队",blueName:"蓝队",team:"red",result:null,timer:null};
function word(w,m,u,e){return{id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,word:w,meaning:m,unit:u,example:e,misses:0,wins:0,attempts:0}}
function parse(raw){let unit="未分组";return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).flatMap(line=>{line=line.replace(/^[-*]\s*/,"");if(/^(unit|module|lesson|book)\s*[\w\d\u4e00-\u9fa5 -]*$/i.test(line)){unit=line;return[]}let p=line.split(/\s*(?:\||\t|，|；|;)\s*/).map(x=>x.trim()).filter(Boolean),w=p[0]||"",m=p[1]||"",e=p[2]||"",u=p[3]||unit;if(p.length===1){let a=line.match(/^([A-Za-z][A-Za-z .'-]+)\s+(.+)$/);if(a){w=a[1].trim();m=a[2].trim()}}return w?[word(w,m||"待补充释义",u,e)]:[]})}
function norm(a){return a.map(x=>({id:x.id||`${Date.now()}-${Math.random()}`,word:x.word,meaning:x.meaning||"待补充释义",unit:x.unit||"未分组",example:x.example||x.examples||"",misses:x.misses||0,wins:x.wins||0,attempts:x.attempts||0}))}
function save(){localStorage.setItem("word-pk-choice-v1",JSON.stringify({words:S.words,active:S.active,redScore:S.redScore,blueScore:S.blueScore,redName:S.redName,blueName:S.blueName,roundTime:S.roundTime,optCount:S.optCount,team:S.team}))}
function load(){let raw=localStorage.getItem("word-pk-choice-v1")||localStorage.getItem("word-pk-classroom-v2");if(raw)try{let d=JSON.parse(raw);S.words=Array.isArray(d.words)&&d.words.length?norm(d.words):parse(sample);S.active=Math.min(d.active||d.activeIndex||0,S.words.length-1);S.redScore=d.redScore||0;S.blueScore=d.blueScore||0;S.redName=d.redName||"红队";S.blueName=d.blueName||"蓝队";S.roundTime=d.roundTime||30;S.optCount=d.optCount||d.optionCount||4;S.team=d.team||d.currentTeam||"red"}catch{S.words=parse(sample)}else S.words=parse(sample);S.seconds=S.roundTime;E.raw.value=sample;E.redName.value=S.redName;E.blueName.value=S.blueName;E.time.value=S.roundTime;E.optCount.value=S.optCount;makeOptions()}
function current(){return S.words[S.active]||word("ready","请先导入词库","课堂","")}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeOptions(){let c=current(),pool=shuffle([...new Set(S.words.filter(x=>x.id!==c.id).map(x=>x.meaning).filter(x=>x&&x!==c.meaning))]),o=[{text:c.meaning,ok:true}];while(o.length<S.optCount&&pool.length)o.push({text:pool.shift(),ok:false});while(o.length<S.optCount)o.push({text:`干扰项 ${o.length}`,ok:false});S.options=shuffle(o);S.selected=null;S.result=null}
function next(){if(S.words.length>1){let n=Math.floor(Math.random()*S.words.length);while(n===S.active)n=Math.floor(Math.random()*S.words.length);S.active=n}S.seconds=S.roundTime;makeOptions();startTimer();render()}
function choose(i){if(S.selected!==null)return;let c=current(),o=S.options[i];S.selected=i;c.attempts++;if(o.ok){c.wins++;score(1);S.result="ok"}else{c.misses++;score(-1);S.result="bad"}stopTimer();render()}
function score(n){if(S.team==="red")S.redScore+=n;else S.blueScore+=n}
function wrong(){if(S.selected!==null)return;let c=current();c.attempts++;c.misses++;score(-1);S.result="bad";S.selected=-1;stopTimer();render()}
function startTimer(){stopTimer();S.running=true;S.timer=setInterval(()=>{S.seconds=Math.max(0,S.seconds-1);if(S.seconds===0)stopTimer();render()},1000)}
function stopTimer(){if(S.timer)clearInterval(S.timer);S.timer=null;S.running=false}
function toggle(){S.running?stopTimer():startTimer();render()}
function reset(){stopTimer();S.redScore=0;S.blueScore=0;S.seconds=S.roundTime;S.words=S.words.map(x=>({...x,misses:0,wins:0,attempts:0}));makeOptions();render()}
function setTeam(t){S.team=t;render()}
function esc(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function meta(t,c=""){let s=document.createElement("span");s.className=c;s.textContent=t;E.meta.appendChild(s)}
function render(){let c=current(),miss=S.words.filter(x=>x.misses>0),units=new Map();S.words.forEach(x=>units.set(x.unit||"未分组",(units.get(x.unit||"未分组")||0)+1));let done=S.words.reduce((a,x)=>a+x.attempts,0),prog=Math.round(done/Math.max(S.words.length,1)*100),team=S.team==="red"?S.redName:S.blueName;E.wordCount.textContent=S.words.length;E.doneCount.textContent=done;E.missCount.textContent=miss.length;E.unitCount.textContent=units.size;E.bar.style.width=prog+"%";E.redScore.textContent=S.redScore;E.blueScore.textContent=S.blueScore;E.redLabel.textContent=S.redName;E.blueLabel.textContent=S.blueName;E.seconds.textContent=S.seconds;E.clockText.textContent=S.running?"倒计时":S.seconds===0?"时间到":"准备";E.redCard.classList.toggle("active",S.team==="red");E.blueCard.classList.toggle("active",S.team==="blue");E.redTurn.classList.toggle("active",S.team==="red");E.blueTurn.classList.toggle("active",S.team==="blue");E.meta.innerHTML="";meta(c.unit||"未分组");meta(team+" 作答");if(S.result==="ok")meta("答对 +1","ok");if(S.result==="bad")meta("答错 -1","bad");E.question.textContent=c.word;E.opts.innerHTML=S.options.map((o,i)=>{let cls="";if(S.selected!==null){if(o.ok)cls="correct";if(S.selected===i&&!o.ok)cls="wrong"}return`<button class="opt ${cls}" data-o="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></button>`}).join("");let ok=S.options.find(o=>o.ok);E.answer.textContent=S.selected===null?"":"答案："+(ok?ok.text:c.meaning);E.wordGrid.innerHTML=S.words.map((x,i)=>`<button class="worditem ${i===S.active?"active":""}" data-i="${i}"><strong>${esc(x.word)}</strong><span>${esc(x.meaning)}</span></button>`).join("");E.units.innerHTML=[...units.entries()].map(([u,n])=>`<div class="row"><div><strong>${esc(u)}</strong><span>${n} 个单词</span></div><b class="badge">${n}</b></div>`).join("");E.missList.innerHTML=miss.length?miss.map(x=>`<div class="row miss"><div><strong>${esc(x.word)}</strong><span>${esc(x.meaning)}</span></div><b class="badge">${x.misses}</b></div>`).join(""):`<div class="empty">还没有错题</div>`;save()}
function exportCsv(onlyMiss=false){let list=onlyMiss?S.words.filter(x=>x.misses>0):S.words,rows=list.map(x=>[x.unit,x.word,x.meaning,x.example,x.misses,x.wins,x.attempts].map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(","));let blob=new Blob([`\ufeff单元,单词,释义,例句,错题次数,答对次数,作答次数\n${rows.join("\n")}`],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=onlyMiss?"错词复盘.csv":"课本单词库.csv";a.click();URL.revokeObjectURL(url)}
$("#importBtn").onclick=()=>{let w=parse(E.raw.value);if(w.length){S.words=w;S.active=0;S.seconds=S.roundTime;makeOptions();render()}};$("#sampleBtn").onclick=()=>{E.raw.value=sample;S.words=parse(sample);S.active=0;makeOptions();render()};$("#fileBtn").onclick=()=>E.file.click();E.file.onchange=async e=>{let f=e.target.files[0];if(!f)return;E.raw.value=await f.text();let w=parse(E.raw.value);if(w.length){S.words=w;S.active=0;makeOptions();render()}};E.redName.oninput=()=>{S.redName=E.redName.value.trim()||"红队";render()};E.blueName.oninput=()=>{S.blueName=E.blueName.value.trim()||"蓝队";render()};E.time.onchange=()=>{S.roundTime=Math.min(Math.max(Number(E.time.value)||30,5),180);S.seconds=S.roundTime;render()};E.optCount.onchange=()=>{S.optCount=Math.min(Math.max(Number(E.optCount.value)||4,2),6);makeOptions();render()};E.redTurn.onclick=()=>setTeam("red");E.blueTurn.onclick=()=>setTeam("blue");$("#start").onclick=toggle;$("#next").onclick=next;$("#wrong").onclick=wrong;$("#screen").onclick=()=>document.body.classList.toggle("fullscreen");$("#reset").onclick=reset;$("#exportAll").onclick=()=>exportCsv(false);$("#exportMiss").onclick=()=>exportCsv(true);E.opts.onclick=e=>{let b=e.target.closest("[data-o]");if(b)choose(Number(b.dataset.o))};E.wordGrid.onclick=e=>{let b=e.target.closest("[data-i]");if(!b)return;stopTimer();S.active=Number(b.dataset.i);S.seconds=S.roundTime;makeOptions();render()};document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;if(e.key===" "){e.preventDefault();toggle()}if(e.key==="Enter")next();if(e.key.toLowerCase()==="r")setTeam("red");if(e.key.toLowerCase()==="b")setTeam("blue");if(e.key.toLowerCase()==="w")wrong();let n=Number(e.key);if(n>=1&&n<=S.options.length)choose(n-1)});load();render();
</script>
